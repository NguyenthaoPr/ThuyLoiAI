<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>THỦY LỢI AI</title>

    <meta
        name="description"
        content="Trợ lý AI chuyên ngành Thủy lợi"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f9fc,
                    #eef5f8
                );

            color: #17324d;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 820px;

            margin: 0 auto;

            padding:
                45px 20px 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 58px;
            line-height: 1;

            margin-bottom: 12px;
        }

        .title {
            margin: 0;

            font-size: 34px;
            font-weight: 700;

            letter-spacing: 0.5px;

            color: #006fae;
        }

        .subtitle {
            margin-top: 8px;

            font-size: 16px;

            color: #71869a;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 22px;

            box-shadow:
                0 8px 30px
                rgba(0, 80, 120, 0.08);

            border:
                1px solid
                rgba(0, 130, 190, 0.10);
        }

        .label {
            display: block;

            margin-bottom: 10px;

            font-size: 15px;

            font-weight: 700;

            color: #17324d;
        }

        /* =========================
           QUESTION
        ========================= */

        textarea {
            width: 100%;

            min-height: 145px;

            resize: vertical;

            padding: 16px;

            border-radius: 12px;

            border:
                1px solid
                #cbd9e3;

            outline: none;

            font-size: 16px;

            line-height: 1.6;

            color: #17324d;

            background: #fbfdff;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #0798d4;

            box-shadow:
                0 0 0 3px
                rgba(7, 152, 212, 0.12);
        }

        textarea::placeholder {
            color: #9aaab7;
        }

        /* =========================
           BUTTON
        ========================= */

        .button {
            width: 100%;

            margin-top: 16px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #078dcc,
                    #0076b6
                );

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                box-shadow 0.15s,
                opacity 0.15s;
        }

        .button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(0, 120, 180, 0.22);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            cursor: wait;

            opacity: 0.65;

            transform: none;

            box-shadow: none;
        }

        /* =========================
           ANSWER
        ========================= */

        .answer {
            min-height: 150px;

            padding: 18px;

            border-radius: 12px;

            background:
                #f7fafc;

            border:
                1px solid
                #dce7ee;

            white-space: pre-wrap;

            word-wrap: break-word;

            font-size: 16px;

            line-height: 1.75;

            color: #263f54;
        }

        .answer.loading {
            color: #078dcc;
        }

        .answer.error {
            color: #c0392b;

            background: #fff8f7;

            border-color: #f0c7c2;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            text-align: center;

            font-size: 13px;

            color: #8a9aa7;

            margin-top: 18px;
        }

        .status-dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #28a745;

            margin-right: 5px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 28px;

            font-size: 13px;

            color: #8a9aa7;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding:
                    28px 14px 20px;
            }

            .title {
                font-size: 27px;
            }

            .subtitle {
                font-size: 14px;
            }

            .logo {
                font-size: 48px;
            }

            .card {
                padding: 18px;

                border-radius: 15px;
            }

            textarea {
                min-height: 130px;

                font-size: 16px;
            }

            .answer {
                font-size: 15px;

                line-height: 1.65;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <div class="logo">
            💧
        </div>

        <h1 class="title">
            THỦY LỢI AI
        </h1>

        <div class="subtitle">
            Trợ lý AI chuyên ngành Thủy lợi
        </div>

    </div>


    <!-- =========================
         QUESTION
    ========================== -->

    <div class="card">

        <label
            class="label"
            for="question"
        >
            Câu hỏi
        </label>

        <textarea
            id="question"
            placeholder="Nhập câu hỏi về công trình, hồ chứa, trạm bơm, vận hành thủy lợi..."
            autocomplete="off"
        ></textarea>


        <button
            id="askButton"
            class="button"
            onclick="askAI()"
        >
            HỎI AI
        </button>

    </div>


    <!-- =========================
         ANSWER
    ========================== -->

    <div class="card">

        <label class="label">
            Câu trả lời
        </label>

        <div
            id="answer"
            class="answer"
        >
            Hãy nhập câu hỏi để bắt đầu.
        </div>

    </div>


    <!-- =========================
         STATUS
    ========================== -->

    <div class="status">

        <span class="status-dot"></span>

        THỦY LỢI AI đang kết nối NotebookLM

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">

        THỦY LỢI AI • Phiên bản thử nghiệm

    </div>

</div>


<script>

    /*
    ==========================================
    CẤU HÌNH API
    ==========================================

    Cloudflare Tunnel hiện tại:

    https://data-confidentiality-transmission-provide.trycloudflare.com

    ==========================================
    */

    const API_URL =
        "https://data-confidentiality-transmission-provide.trycloudflare.com";


    /*
    ==========================================
    HÀM HỎI AI
    ==========================================
    */

    async function askAI() {

        const questionElement =
            document.getElementById("question");

        const answerElement =
            document.getElementById("answer");

        const buttonElement =
            document.getElementById("askButton");


        const question =
            questionElement.value.trim();


        /*
        -------------------------------
        Kiểm tra câu hỏi
        -------------------------------
        */

        if (!question) {

            answerElement.className =
                "answer error";

            answerElement.innerText =
                "Vui lòng nhập câu hỏi.";

            questionElement.focus();

            return;
        }


        /*
        -------------------------------
        Trạng thái đang xử lý
        -------------------------------
        */

        buttonElement.disabled = true;

        buttonElement.innerText =
            "ĐANG HỎI AI...";


        answerElement.className =
            "answer loading";

        answerElement.innerText =
            "⏳ Đang kết nối NotebookLM...\n\n" +
            "Vui lòng chờ trong giây lát.";


        try {

            /*
            -------------------------------
            Gửi câu hỏi tới FastAPI
            -------------------------------
            */

            const response =
                await fetch(
                    API_URL + "/ask",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                question:
                                    question
                            })
                    }
                );


            /*
            -------------------------------
            Kiểm tra HTTP
            -------------------------------
            */

            if (!response.ok) {

                throw new Error(
                    "Máy chủ trả về HTTP " +
                    response.status
                );
            }


            /*
            -------------------------------
            Nhận JSON
            -------------------------------
            */

            const data =
                await response.json();


            /*
            -------------------------------
            Hiển thị câu trả lời
            -------------------------------
            */

            if (
                data &&
                typeof data.answer === "string"
            ) {

                answerElement.className =
                    "answer";

                answerElement.innerText =
                    data.answer;

            } else {

                throw new Error(
                    "Dữ liệu trả về không hợp lệ."
                );
            }


        } catch (error) {

            /*
            -------------------------------
            Lỗi kết nối
            -------------------------------
            */

            console.error(
                "Lỗi THỦY LỢI AI:",
                error
            );


            answerElement.className =
                "answer error";


            answerElement.innerText =
                "❌ Không kết nối được với THỦY LỢI AI.\n\n" +

                "Chi tiết: " +
                error.message +
                "\n\n" +

                "Hãy kiểm tra:\n" +

                "• Python/FastAPI đang chạy\n" +

                "• Cloudflare Tunnel đang chạy\n" +

                "• Máy tính đang bật\n" +

                "• Kết nối Internet đang hoạt động";

        } finally {

            /*
            -------------------------------
            Trả nút về trạng thái bình thường
            -------------------------------
            */

            buttonElement.disabled = false;

            buttonElement.innerText =
                "HỎI AI";
        }
    }


    /*
    ==========================================
    CTRL + ENTER ĐỂ HỎI AI
    ==========================================
    */

    document
        .getElementById("question")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.ctrlKey &&
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    askAI();
                }

            }
        );


    /*
    ==========================================
    ENTER KHÔNG GỬI
    CTRL + ENTER MỚI GỬI
    ==========================================
    */


</script>

</body>
</html>
