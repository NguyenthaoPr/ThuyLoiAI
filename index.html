<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08233d">
<title>THỦY LỢI AI</title>
<style>
:root{
  --primary:#2563EB;
  --deep-navy:#0F2742;
  --success:#10B981;
  --warning:#F59E0B;
  --error:#EF4444;
  --error-bg:#FEF2F2;
  --success-bg:#ECFDF5;
  --text:#1E293B;
  --text-secondary:#64748B;
  --border:#D9E2EC;
  --background:#F5F8FB;
  --surface:#FFFFFF;
  --surface-soft:#F8FAFC;
  --focus-ring:rgba(37,99,235,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--background);color:var(--text)}
body{overflow-x:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}

.header{background:var(--deep-navy);color:#fff;padding:13px 14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(15,39,66,.14)}
.header-inner{max-width:760px;margin:auto;display:flex;align-items:center;gap:11px;min-height:44px}
.logo{width:42px;height:42px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brand{min-width:0}.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:800;letter-spacing:.1px}.brand p{font-size:11px;line-height:1.35;margin:3px 0 0;opacity:.82}
.status{margin-left:auto;font-size:11px;white-space:nowrap;display:flex;align-items:center;padding:5px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warning);margin-right:5px;box-shadow:0 0 0 2px rgba(245,158,11,.12)}.dot.ok{background:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.14)}.dot.bad{background:var(--error);box-shadow:0 0 0 2px rgba(239,68,68,.14)}

main{width:100%;max-width:960px;margin:auto;padding:12px 10px 28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin-bottom:11px;box-shadow:0 5px 18px rgba(15,39,66,.06)}
.hero{padding:19px}.hero h2{font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:800;letter-spacing:-.2px}.hero p{font-size:15px;line-height:1.65;color:var(--text-secondary);margin:0;max-width:680px}
.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.info span{font-size:12px;color:#496075;background:var(--surface-soft);border:1px solid var(--border);border-radius:10px;padding:7px 9px}

.quick-title{font-size:13px;font-weight:700;padding:13px 13px 8px;color:var(--text)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 11px}.quick button{min-height:44px;border:1px solid var(--border);background:var(--surface-soft);border-radius:11px;padding:8px;font-size:13px;color:#344b5e}.quick button:hover{border-color:#B9CCE0;background:#F5F9FF}.quick button:active{background:#EAF3FF}

.chat{overflow:hidden;width:100%;display:flex;flex-direction:column;min-height:calc(100dvh - 84px)}.chat-title{height:49px;padding:0 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.clear{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 9px;font-size:11px;color:var(--text-secondary)}.clear:hover{background:var(--surface-soft);color:var(--text)}

.messages{height:52vh;min-height:330px;max-height:600px;overflow-y:auto;padding:16px 14px;background:#F8FAFC;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{display:flex;margin-bottom:13px}.msg.user{justify-content:flex-end}
.bubble{max-width:92%;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.65;word-break:break-word;overflow-wrap:anywhere}
.user .bubble{background:var(--primary);color:#fff;border-top-right-radius:5px;box-shadow:0 2px 7px rgba(37,99,235,.12)}.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:5px;box-shadow:0 2px 7px rgba(15,39,66,.04)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}.bubble strong{font-weight:750;color:inherit}.bubble ul,.bubble ol{margin:6px 0 6px 19px;padding:0}.bubble li{margin:3px 0}

.source{margin-top:12px;padding:12px 12px 11px;border-radius:12px;background:#F8FAFC;border:1px solid var(--border);border-left:4px solid var(--primary);font-size:13px;line-height:1.55;color:var(--text-secondary)}.source b{display:block;color:var(--text);font-size:14px;font-weight:750;margin-bottom:5px}
.typing{display:none;padding:10px 13px;border-top:1px solid var(--border);color:var(--text-secondary);font-size:13px;line-height:1.45;background:var(--surface)}.typing.show{display:block}

.compose{background:var(--surface);border-top:1px solid var(--border);padding:11px}.row{display:flex;gap:8px;align-items:stretch}
textarea{flex:1;min-width:0;height:52px;max-height:130px;border:1px solid #C5D3E0;border-radius:14px;padding:12px 13px;font-size:16px;line-height:1.45;resize:none;outline:none;background:var(--surface);color:var(--text)}textarea::placeholder{color:var(--text-secondary);opacity:1}textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}

.camera-btn{width:48px;min-width:48px;height:52px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center}
.camera-btn:hover{background:var(--surface-soft);border-color:#B9CCE0}
.camera-btn:active{background:#EAF3FF}
.image-preview{margin-top:8px;padding:9px 10px;border:1px solid var(--border);border-radius:11px;background:var(--surface-soft);font-size:12px;line-height:1.45;color:var(--text-secondary)}
.image-preview strong{color:var(--text)}
.image-preview .thumb{width:58px;height:58px;object-fit:cover;border-radius:9px;border:1px solid var(--border);vertical-align:middle;margin-right:8px}
.send{width:52px;min-width:52px;height:52px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .05s ease}.send:hover{background:#1D4ED8}.send:active{background:#1E40AF;transform:translateY(1px)}.send:disabled{opacity:.55;cursor:not-allowed}
.hint{display:none}.footer{display:none}

.uiCompat{display:none}.docs{display:none;padding:0 10px 10px}.docs.show{display:block}.doc{padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--surface-soft);margin-top:7px;font-size:13px;line-height:1.5;color:var(--text-secondary)}.doc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}.doc i{color:var(--success);font-style:normal}

@media(max-width:760px){
  main{max-width:960px;padding-left:9px;padding-right:9px}
  .header{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .compose{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .messages{height:auto;flex:1;min-height:0;max-height:none}
}

@media(max-width:480px){
  .header-inner{gap:9px}
  .logo{width:40px;height:40px;border-radius:12px;font-size:23px}
  .brand h1{font-size:18px}
  .brand p{font-size:10.5px}
  .status{font-size:10px;padding:5px 7px}
  .hero{padding:17px}
  .hero h2{font-size:21px}
  .quick{grid-template-columns:1fr 1fr;gap:7px}
  .quick button{min-height:44px;font-size:12px}
  .messages{height:auto;flex:1;min-height:0;max-height:none;padding:14px 11px}
  .bubble{max-width:94%;font-size:16px;line-height:1.65}
  .compose{padding-top:9px;position:sticky;bottom:0;z-index:2}
  textarea{height:50px}
  .send{width:52px;min-width:52px;height:52px}
}

@media(max-width:380px){
  .brand h1{font-size:17px}
  .status{font-size:9px}
  .hero h2{font-size:19px}
  .bubble{font-size:16px}
  .quick button{font-size:11px}
  .messages{min-height:290px}
}

</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">💧</div>
    <div class="brand"><h1>THỦY LỢI AI</h1><p>Trợ lý AI chuyên ngành Thủy lợi</p></div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Đang kiểm tra...</span></div>
  </div>
</header>

<main>
<section class="card chat">
  <div class="chat-title"><span>💬 Trao đổi với THỦY LỢI AI</span><button class="clear" id="clear">Xóa</button></div>
  <div class="messages" id="messages">
  </div>
  <div class="typing" id="typing">⏳ Đang tra cứu hồ sơ và phân tích...</div>
  <div class="compose">
    <div class="row"><input id="imageInput" type="file" accept="image/*" capture="environment" hidden aria-label="Chụp hoặc chọn ảnh hiện trường"><button id="cameraBtn" class="camera-btn" type="button" aria-label="Chụp hoặc chọn ảnh" title="Chụp hoặc chọn ảnh">📷</button><textarea id="question" placeholder="Nhập câu hỏi về thủy lợi..."></textarea><button class="send" id="send" aria-label="Gửi câu hỏi" title="Gửi câu hỏi"><span aria-hidden="true">➤</span></button></div><div id="imagePreview" class="image-preview" hidden aria-live="polite"></div>
    <div class="hint">Enter để gửi • Shift + Enter để xuống dòng</div>
  </div>
</section>
<div class="footer">THỦY LỢI AI • FastAPI • Gemini File Search</div>

<div id="uiCompat" hidden aria-hidden="true">
  <span id="count">—</span>
  <button id="docsBtn" type="button"></button>
  <div id="docs"><div id="docList"></div></div>
</div>
</main>

<script>
const imageInput=document.getElementById("imageInput");
const cameraBtn=document.getElementById("cameraBtn");
const imagePreview=document.getElementById("imagePreview");

async function sha256Hex(blob){
  const buffer=await blob.arrayBuffer();
  const digest=await crypto.subtle.digest("SHA-256",buffer);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function resizeImage(file,maxSide=1600,quality=.82){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*scale));
      const h=Math.max(1,Math.round(img.naturalHeight*scale));
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d",{alpha:false});
      if(!ctx){reject(new Error("Không tạo được bộ xử lý ảnh."));return}
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>blob?resolve({blob,w,h}):reject(new Error("Không nén được ảnh.")),"image/jpeg",quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Không đọc được ảnh."))};
    img.src=url;
  });
}

cameraBtn.addEventListener("click",()=>imageInput.click());

imageInput.addEventListener("change",async()=>{
  const file=imageInput.files?.[0];
  if(!file)return;
  imagePreview.hidden=false;
  imagePreview.innerHTML="📷 Đang chuẩn bị ảnh...";
  try{
    const result=await resizeImage(file);
    const hash=await sha256Hex(result.blob);
    const sizeKB=Math.round(result.blob.size/1024);
    const originalKB=Math.round(file.size/1024);
    const thumbUrl=URL.createObjectURL(result.blob);
    imagePreview.innerHTML=
      '<img class="thumb" src="'+thumbUrl+'" alt="Ảnh đã chuẩn bị">'+
      '<strong>Ảnh sẵn sàng</strong><br>'+
      'JPEG · '+result.w+'×'+result.h+
      ' · '+sizeKB+' KB'+
      ' · gốc '+originalKB+' KB'+
      '<br>SHA-256: '+hash;
  }catch(err){
    imagePreview.hidden=false;
    imagePreview.textContent="⚠️ "+(err.message||"Không xử lý được ảnh.");
  }
});


const q=document.getElementById("question"),send=document.getElementById("send"),messages=document.getElementById("messages");
const typing=document.getElementById("typing"),dot=document.getElementById("dot"),statusEl=document.getElementById("status");
const count=document.getElementById("count"),docs=document.getElementById("docs"),docList=document.getElementById("docList");

let isCooldown = false;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

function cleanText(s){
  s=String(s??"");
  s=s.replace(/\\text\s*\{([^{}]*)\}/g,"$1");
  s=s.replace(/\\mathrm\s*\{([^{}]*)\}/g,"$1");
  s=s.replace(/\\operatorname\s*\{([^{}]*)\}/g,"$1");
  s=s.replace(/\\varnothing/g,"Ø").replace(/\\emptyset/g,"Ø");
  s=s.replace(/\\times/g,"×").replace(/\\cdot/g,"·");
  s=s.replace(/\\pm/g,"±").replace(/\\leq/g,"≤").replace(/\\geq/g,"≥");
  s=s.replace(/\\approx/g,"≈").replace(/\\Delta/g,"Δ");
  s=s.replace(/\\%/g,"%");
  s=s.replace(/m\s*\^\s*3/g,"m³").replace(/m3\b/gi,"m³");
  s=s.replace(/m\s*\^\s*2/g,"m²");
  s=s.replace(/\\left|\\right/g,"");
  s=s.replace(/\$\$([\s\S]*?)\$\$/g,"$1").replace(/\$([^$\n]+)\$/g,"$1");
  s=s.replace(/\\([A-Za-z]+)\s*\{([^{}]*)\}/g,"$2");
  s=s.replace(/\\([A-Za-z]+)/g,"$1");
  return s;
}

function md(s){
  s=esc(cleanText(s));
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s=s.replace(/^[-•]\s+(.+)$/gm,"• $1");
  s=s.replace(/\n/g,"<br>");
  return s;
}

function addUser(text){
  const m=document.createElement("div");m.className="msg user";
  const b=document.createElement("div");b.className="bubble";b.textContent=text;m.appendChild(b);
  messages.appendChild(m);messages.scrollTop=messages.scrollHeight;
}

function addAI(text,citations){
  const m=document.createElement("div");m.className="msg assistant";
  const b=document.createElement("div");b.className="bubble";
  b.innerHTML=md(text||"Không có câu trả lời.");
  if(Array.isArray(citations)&&citations.length){
    const box=document.createElement("div");box.className="source";box.innerHTML="<b>📚 Nguồn hồ sơ</b>";
    const seen=new Set();
    citations.forEach(c=>{
      const name=c?.file_name||c?.title||c?.display_name||c?.name;
      if(name&&!seen.has(name)){seen.add(name);const line=document.createElement("div");line.textContent="• "+name;box.appendChild(line);}
    });
    if(seen.size)b.appendChild(box);
  }
  m.appendChild(b);messages.appendChild(m);messages.scrollTop=messages.scrollHeight;
}

async function fetchJSON(url,options={},timeout=40000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{...options,signal:controller.signal,cache:"no-store"});
    const text=await r.text();
    let data={};
    try{data=text?JSON.parse(text):{};}catch{throw new Error("Server trả về dữ liệu không hợp lệ.");}
    if(!r.ok)throw new Error(data.detail||data.error||("HTTP "+r.status));
    return data;
  }finally{clearTimeout(timer);}
}

// KHẮC PHỤC LỖI TRẠNG THÁI CHƯA SẴN SÀNG TẠI ĐÂY
async function health(){
  try{
    const d=await fetchJSON("/health",{},12000);
    // Sửa d.file_search_ready -> d.gemini_client_ready && d.file_search_configured
    const ok = d.status==="ok" && d.gemini_configured && d.gemini_client_ready && d.file_search_configured;
    dot.className="dot "+(ok?"ok":"bad");statusEl.textContent=ok?"Đã kết nối":"Chưa sẵn sàng";
  }catch(e){dot.className="dot bad";statusEl.textContent="Không kết nối";}
}

async function loadDocs(){
  try{
    const d=await fetchJSON("/documents",{},15000);docList.innerHTML="";
    if(!Array.isArray(d.documents)||!d.documents.length){docList.innerHTML='<div class="doc">Kho hồ sơ hiện chưa có tài liệu.</div>';return;}
    count.textContent=d.count;
    d.documents.forEach(x=>{
      const el=document.createElement("div");el.className="doc";
      el.innerHTML="<b>"+esc(x.display_name||x.name||"Tài liệu")+"</b><i>● "+esc(x.state||"ACTIVE")+"</i>";
      docList.appendChild(el);
    });
  }catch(e){docList.innerHTML='<div class="doc">Không tải được danh sách hồ sơ.</div>';}
}

// Xử lý đếm ngược khi dính Rate Limit 429
function startCooldown(seconds) {
  isCooldown = true;
  send.disabled = true;
  q.disabled = true;
  let left = Math.ceil(seconds || 30);
  
  const timer = setInterval(() => {
    send.textContent = `${left}s`;
    left--;
    if (left < 0) {
      clearInterval(timer);
      isCooldown = false;
      send.disabled = false;
      q.disabled = false;
      send.textContent = "Gửi";
      q.focus();
    }
  }, 1000);
}

async function ask(){
  const question=q.value.trim();if(!question||send.disabled||isCooldown)return;
  addUser(question);q.value="";send.disabled=true;q.disabled=true;typing.classList.add("show");
  
  try{
  const d = await fetchJSON("https://thuyloi-cache.thaotltb.workers.dev/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({question})
    },55000);

    addAI(d.answer||d.message||"Không có câu trả lời.", d.sources||d.citations||[]);

    // Nếu Backend báo 429 Rate Limit, kích hoạt đếm ngược khóa nút Gửi
    if (d.status === "rate_limited" && d.retry_after) {
      startCooldown(d.retry_after);
    }
  }catch(e){
    addAI("⚠️ "+(e.message||"Không thể lấy câu trả lời."),[]);
  }finally{
    if (!isCooldown) {
      send.disabled=false;q.disabled=false;send.textContent="Gửi";q.focus();
    }
    typing.classList.remove("show");
  }
}

send.onclick=ask;
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}});
document.getElementById("clear").onclick=()=>{messages.innerHTML='<div class="msg assistant"><div class="bubble"><strong>Đã xóa cuộc trò chuyện. 🌿</strong><p>Hãy đặt câu hỏi mới.</p></div></div>';};
document.getElementById("docsBtn").onclick=()=>{docs.classList.toggle("show");if(docs.classList.contains("show"))loadDocs();};
document.querySelectorAll(".quick button").forEach(btn=>btn.onclick=()=>{q.value=btn.getAttribute("data-q")||"";q.focus();});

health();
loadDocs();
setInterval(health,30000);
</script>
</body>
</html>
